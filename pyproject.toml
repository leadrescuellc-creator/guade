[project]
name = "guade-workflow-agent"
version = "0.1.0"
description = "GUADE local-first workflow agent runtime"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "LeadRescue LLC" }]

[project.scripts]
guade = "workflow_agent.cli:main"
guade-dashboard = "workflow_agent.dashboard:main"
workflow-agent = "workflow_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["workflow_agent"]
